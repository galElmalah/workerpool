<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Cadence — plan, train and read your progress." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>cadence</title>
    <script>
      // Theme + motion before first paint (no flash). Mirrors src/shell/theme.ts and src/motion/prefs.ts.
      (function () {
        try {
          var t = localStorage.getItem('cadence.theme') || 'dark';
          if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
          if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fafafa');
          var m = localStorage.getItem('cadence.motion');
          if (m === 'reduced' || (m !== 'full' && matchMedia('(prefers-reduced-motion: reduce)').matches))
            document.documentElement.dataset.motion = 'reduced';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
