# XcodeGen spec for the Cadence iOS app + widget extension.
#   brew install xcodegen && xcodegen && open Cadence.xcodeproj
# Identifiers, team and App Group live in Config/Cadence.xcconfig (edit that file, not this one).
# Info.plist and .entitlements files are generated from the `info` / `entitlements` blocks below.
name: Cadence

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

configFiles:
  Debug: Config/Cadence.xcconfig
  Release: Config/Cadence.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  CadenceKit:
    path: CadenceKit

targets:
  Cadence:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: CadenceKit
      - target: CadenceWidgets
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Cadence
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - cadence
        # Read by CadenceKit.AppGroupConfig.fromInfoPlist()
        CadenceAppGroup: $(CADENCE_APP_GROUP)
        CadenceKeychainGroup: $(AppIdentifierPrefix)$(CADENCE_KEYCHAIN_GROUP)
        # ATS: HTTPS everywhere; plain HTTP only to local development hosts (localhost, *.local,
        # private-network IPs). ServerAddress.normalize enforces the same rule in code.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Cadence connects to a development server on your local network when you enter its address.
        ITSAppUsesNonExemptEncryption: false
        # Background app refresh keeps the widget snapshot fresh (App/Core/BackgroundRefresh.swift).
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
    entitlements:
      path: App/Cadence.entitlements
      properties:
        com.apple.security.application-groups:
          - $(CADENCE_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(CADENCE_KEYCHAIN_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CADENCE_BUNDLE_ID)
        PRODUCT_NAME: Cadence
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  CadenceWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
      # Shared (Theme, DataColor, components) and Shared/Intents (App Intents) are compiled into
      # both targets; the AppShortcutsProvider is app-only (one per app bundle).
      - path: Shared
        excludes:
          - "Intents/AppOnly/**"
    dependencies:
      - package: CadenceKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Cadence
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CadenceAppGroup: $(CADENCE_APP_GROUP)
        CadenceKeychainGroup: $(AppIdentifierPrefix)$(CADENCE_KEYCHAIN_GROUP)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Widgets/CadenceWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(CADENCE_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(CADENCE_KEYCHAIN_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CADENCE_BUNDLE_ID).widgets
        PRODUCT_NAME: CadenceWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        ENABLE_PREVIEWS: YES

schemes:
  Cadence:
    build:
      targets:
        Cadence: all
        CadenceWidgets: all
    run:
      config: Debug
    archive:
      config: Release
  CadenceWidgets:
    build:
      targets:
        CadenceWidgets: all
        Cadence: all
    run:
      config: Debug
      askForAppToLaunch: true
